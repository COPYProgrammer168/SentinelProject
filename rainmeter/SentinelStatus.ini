[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Sentinel Status
Author=Sentinel
Information=Shows Sentinel security monitor status
Version=1.0

[Variables]
API_URL=http://127.0.0.1:5000/api/overview
REFRESH_TOKEN=

[MeasureSentinelOverview]
Measure=WebParser
URL=#API_URL#
RegExp=(.*)
UserAgent=Sentinel-Rainmeter
FinishAction=!UpdateMeasure MeasureAlertCount

[MeasureAlertCount]
Measure=WebParser
URL=[MeasureSentinelOverview]
StringIndex=1
RegExp=.*"alerts_total":\s*([0-9]+).*

[MeasureCriticalCount]
Measure=WebParser
URL=[MeasureSentinelOverview]
StringIndex=1
RegExp=.*"alerts_critical":\s*([0-9]+).*

[MeasureFlaggedCount]
Measure=WebParser
URL=[MeasureSentinelOverview]
StringIndex=1
RegExp=.*"network_events_flagged":\s*([0-9]+).*

[StyleTitle]
FontSize=12
FontColor=00ffcc
FontWeight=bold
AntiAlias=1
ClipString=1

[StyleValue]
FontSize=16
FontColor=ffffff
FontWeight=bold
AntiAlias=1
ClipString=1

[StyleLabel]
FontSize=10
FontColor=8b949e
AntiAlias=1
ClipString=1

[MeterTitle]
Meter=String
Text=Sentinel Monitor
MeterStyle=StyleTitle
W=200
H=20

[MeterAlertLabel]
Meter=String
Text=Alerts Fired
MeterStyle=StyleLabel
Y=25
W=200
H=12

[MeterAlertValue]
Meter=String
Text=[MeasureAlertCount]
MeasureName=MeasureAlertCount
MeterStyle=StyleValue
Y=37
W=200
H=20

[MeterCriticalLabel]
Meter=String
Text=Critical
MeterStyle=StyleLabel
Y=62
W=200
H=12

[MeterCriticalValue]
Meter=String
Text=[MeasureCriticalCount]
MeasureName=MeasureCriticalCount
MeterStyle=StyleValue
Y=74
W=200
H=20

[MeterFlaggedLabel]
Meter=String
Text=Flagged Network Events
MeterStyle=StyleLabel
Y=99
W=200
H=12

[MeterFlaggedValue]
Meter=String
Text=[MeasureFlaggedCount]
MeasureName=MeasureFlaggedCount
MeterStyle=StyleValue
Y=111
W=200
H=20
